apiVersion: agents.v1
kind: Agent
metadata:
  id: qwen2.5_coder_7b
  name: Qwen 2.5 Coder 7B Standard Flagship
  version: 1
  description: "Standard local tool-calling flagship with high-reliability tool whitelisting."
  tags: [flagship, 7b, 8b, local]

spec:
  tier: 1
  context_window: 32000
  max_iterations: 30
  prompt_id: "compact_7b_agent"
  is_reasoning_model: false
  strip_think_tags: false
  text_fallback_parser: true

  whitelisted_tools:
    - read_file
    - write_file
    - write_files
    - edit_file
    - insert_text
    - list_directory
    - lint_javascript
    - get_assets
    - ask_human
    - finish
    - execute_command
    - run_background_command
    - stop_background_command

  enabled_subagents:
    - invoke_design_agent
    - invoke_troubleshoot_agent

  target_models:
    - "qwen2.5-coder:7b"
    - "codegemma:7b"
    - "deepseek-coder:6.7b"
    - "starcoder2:7b"
    - "mistral:7b"
    - "llama3.1:8b"
    - "codellama:7b"
