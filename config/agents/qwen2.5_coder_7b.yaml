apiVersion: agents.v1
kind: Agent
metadata:
  id: qwen2.5_coder_7b
  name: Qwen 2.5 Coder 7B Fast Agent
  version: 1
  description: "Ultra-fast code generation and execution with native tool calling, optimized for 16GB machines."
  tags: [fast, 7b, optimal, local]

spec:
  tier: 1
  context_window: 32768
  max_iterations: 100
  prompt_id: "compact_7b_agent"
  is_reasoning_model: false
  strip_think_tags: false
  text_fallback_parser: true
  supports_native_tools: true

  whitelisted_tools:
    - locate_files_by_pattern
    - extract_signatures
    - map_dependencies
    - glob_files
    - grep_search
    - read_file
    - write_file
    - edit_file
    - mount_file
    - unmount_file
    - close_file
    - list_mounted_files
    - lint_javascript
    - get_assets
    - execute_command
    - search_web
    - ask_human
    - finish
    - task
    - hub

  enabled_subagents: []

  target_models:
    - "qwen2.5-coder:7b"
    - "qwen2.5-coder:7b-instruct"
    - "qwen2.5-coder:7b-instruct-q4_K_M"
    - "qwen2.5-coder:latest"
