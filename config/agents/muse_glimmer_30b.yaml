apiVersion: agents.v1
kind: Agent
metadata:
  id: muse_glimmer_30b
  name: Meta Muse Glimmer 30B Agent
  version: 1
  description: "Meta 30B dense multimodal agentic model with native tool failure recovery, controllable reasoning, and 2B vision encoder."
  tags: [multimodal, 30b, dense, agentic, failure_recovery, meta]

spec:
  tier: 3
  context_window: 131072
  max_iterations: 100
  prompt_id: "workstation_32b_agent"
  is_reasoning_model: false
  strip_think_tags: false
  text_fallback_parser: true

  whitelisted_tools:
    - glob_files
    - view_bulk
    - read_file
    - write_file
    - write_files
    - edit_file
    - insert_text
    - grep_search
    - list_directory
    - locate_files_by_pattern
    - extract_signatures
    - map_dependencies
    - lint_javascript
    - get_assets
    - search_web
    - ask_human
    - finish
    - execute_command
    - run_background_command
    - stop_background_command
    - mount_file
    - unmount_file
    - close_file
    - list_mounted_files

  enabled_subagents:
    - invoke_design_agent
    - invoke_troubleshoot_agent
    - invoke_vision_agent
    - invoke_testing_agent
    - invoke_code_reviewer_agent

  target_models:
    - "muse-glimmer:30b"
    - "muse-glimmer"
    - "muse-glimmer:latest"
    - "muse-glimmer:30b-q4_K_M"
    - "muse-glimmer:30b-instruct"
    - "muse-glimmer-30b"
    - "muse_glimmer"
