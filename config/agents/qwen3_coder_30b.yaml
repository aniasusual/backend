apiVersion: agents.v1
kind: Agent
metadata:
  id: qwen3_coder_30b
  name: Qwen3-Coder-30B-A3B Agent
  version: 1
  description: "Next-generation Mixture-of-Experts agentic coding model with 3.3B active parameters and 256k context."
  tags: [moe, 30b, 3.3b_active, qwen3, agentic]

spec:
  tier: 3
  context_window: 262144
  max_iterations: 100
  prompt_id: "workstation_32b_agent"
  is_reasoning_model: false
  strip_think_tags: false
  text_fallback_parser: true

  whitelisted_tools:
    - glob_files
    - view_bulk
    - read_file
    - write_file
    - write_files
    - edit_file
    - insert_text
    - grep_search
    - list_directory
    - locate_files_by_pattern
    - extract_signatures
    - map_dependencies
    - lint_javascript
    - get_assets
    - search_web
    - ask_human
    - finish
    - execute_command
    - run_background_command
    - stop_background_command
    - mount_file
    - unmount_file
    - close_file
    - list_mounted_files

  enabled_subagents:
    - invoke_design_agent
    - invoke_troubleshoot_agent
    - invoke_vision_agent
    - invoke_testing_agent
    - invoke_code_reviewer_agent

  target_models:
    - "qwen3-coder:30b-a3b"
    - "qwen3-coder:30b"
    - "qwen3-coder"
