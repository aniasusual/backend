apiVersion: agents.v1
kind: Agent
metadata:
  id: qwen2.5_coder_1.5b_3b
  name: Qwen 2.5 Coder 1.5B-3B Lightweight Agent
  version: 1
  description: "Minimalist profile with 5 core tools for maximum execution reliability on edge devices."
  tags: [ultra_light, 1.5b, 3b, edge]

spec:
  tier: 0
  context_window: 16000
  max_iterations: 20
  prompt_id: "ultra_light_agent"
  is_reasoning_model: false
  strip_think_tags: false
  text_fallback_parser: true

  whitelisted_tools:
    - read_file
    - write_file
    - edit_file
    - execute_command
    - finish

  enabled_subagents: []

  target_models:
    - "qwen2.5-coder:1.5b"
    - "qwen2.5-coder:3b"
