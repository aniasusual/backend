apiVersion: agents.v1
kind: Agent
metadata:
  id: qwen2.5_coder_14b
  name: Qwen 2.5 Coder 14B Flagship Agent
  version: 1
  description: "High-accuracy multi-file orchestration and planning with native tool support."
  tags: [flagship, 14b, default, local]

spec:
  tier: 2
  context_window: 32768
  max_iterations: 100
  prompt_id: "intermediate_14b_agent"
  is_reasoning_model: false
  strip_think_tags: false
  text_fallback_parser: true

  whitelisted_tools:
    - glob_files
    - view_bulk
    - read_file
    - write_file
    - write_files
    - edit_file
    - insert_text
    - grep_search
    - list_directory
    - locate_files_by_pattern
    - extract_signatures
    - map_dependencies
    - lint_javascript
    - get_assets
    - search_web
    - ask_human
    - finish
    - execute_command
    - run_background_command
    - stop_background_command
    - mount_file
    - unmount_file
    - close_file
    - list_mounted_files

  enabled_subagents:
    - invoke_design_agent
    - invoke_troubleshoot_agent
    - invoke_vision_agent
    - invoke_testing_agent
    - invoke_code_reviewer_agent

  target_models:
    - "qwen2.5-coder:14b"
    - "qwen2.5-coder:14b-instruct"
